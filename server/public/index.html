<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdShare — Advertiser</title><style>
:root{--bg:#10101a;--panel:#1a1928;--line:#302d45;--purple:#7968ff;--muted:#aaa6bc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f5ff;font:14px Inter,system-ui}header{padding:18px 5vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}header b{font-size:21px}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:15px}h2{margin:0 0 14px}input,select,textarea,button{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#12111e;color:white;margin:5px 0;font:inherit}textarea{min-height:65px}button{background:var(--purple);border:0;font-weight:700;cursor:pointer}.secondary{background:#38344e}.muted{color:var(--muted)}.row{display:flex;gap:10px}.row>*{flex:1}.stat{font-size:25px;font-weight:800}.card{padding:13px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#302b49;color:#cfc8ff;font-size:11px}.hidden{display:none}.small{font-size:12px}.good{color:#80e0ae}.bad{color:#ff9d9d}a{color:#b9adff}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header><b>◈ AdShare <span class="muted">/ Advertiser</span></b><a href="/admin.html">Admin portal</a></header><main class="wrap"><section id="auth" class="panel" style="max-width:440px;margin:30px auto"><h2>Advertiser account</h2><div class="row"><button id="showLogin">Sign in</button><button id="showRegister" class="secondary">Create account</button></div><div id="registerFields" class="hidden"><input id="name" placeholder="Your name"><input id="regEmail" placeholder="Work email"><input id="regPassword" type="password" placeholder="Password (10+ characters)"><button id="register">Create account</button></div><div id="loginFields"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in</button></div><p id="authMsg" class="muted"></p></section>
<section id="app" class="hidden"><div class="grid"><div><div class="panel"><h2>Create campaign</h2><label class="muted">Company / advertiser name</label><input id="company" placeholder="Company name"><label class="muted">Ad format</label><select id="type"><option value="text">Text + redirect link — ₹1/show</option><option value="image">Image + redirect link — ₹5/show</option><option value="video">Video + title + redirect link — ₹10/show</option></select><input id="title" placeholder="Ad title"><textarea id="body" placeholder="Short description / message"></textarea><input id="media" placeholder="Public image/video URL (required for image/video)"><input id="click" placeholder="Destination URL (https://...)"><input id="shows" type="number" min="100" max="1000000" value="1000" placeholder="Number of shows"><div class="panel"><div class="muted">Estimated campaign payment</div><div class="stat" id="estimate">₹1,000.00</div><div class="muted small">Payment = format price × requested shows. Campaign starts only after payment verification and admin approval.</div></div><button id="create">Continue to payment</button><p id="createMsg" class="muted small"></p></div></div><div><div class="panel"><div class="row"><div><div class="muted">Campaigns</div><div class="stat" id="count">0</div></div><div><div class="muted">Total impressions</div><div class="stat" id="impressions">0</div></div><div><div class="muted">Active</div><div class="stat" id="active">0</div></div></div></div><div class="panel"><div class="row"><h2 style="flex:1">Your campaigns</h2><button id="refresh" style="width:110px">Refresh</button></div><div id="campaigns"></div></div><div class="panel"><h2>Account</h2><div id="profile" class="muted"></div><button class="secondary" id="logout">Sign out</button></div></div></div></section></main><script src="app.js"></script></body></html>
