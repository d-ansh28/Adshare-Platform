<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdShare</title><style>
*{box-sizing:border-box}body{width:330px;margin:0;padding:18px;background:#11101b;color:#f5f3ff;font:14px Inter,system-ui}header{display:flex;align-items:center;gap:10px;margin-bottom:16px}header img{width:34px;height:34px}h2{font-size:18px;margin:0}.muted{color:#aaa5bd;font-size:12px}input,button{width:100%;padding:10px;border-radius:9px;border:1px solid #39344f;background:#1c1a2a;color:white;margin:5px 0;font:inherit}button{background:#7564ff;border:0;font-weight:700;cursor:pointer}.panel{background:#1c1a2a;padding:12px;border-radius:12px;margin:10px 0}.big{font-size:27px;font-weight:800}.row{display:flex;justify-content:space-between}.hidden{display:none}.error{color:#ff9b9b}.ok{color:#8ee2b0}a{color:#b9adff}
</style></head><body><header><img src="logo.png"><div><h2>AdShare</h2><div class="muted">Earn while AI thinks</div></div></header>
<section id="login"><div class="muted">Sign in to earn rewards from eligible sponsored views.</div><input id="api" placeholder="API URL" value="http://localhost:3000"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Sign in</button><div id="msg" class="muted"></div></section>
<section id="account" class="hidden"><div class="panel"><div class="muted">Available balance</div><div class="big" id="balance">₹0.00</div><div class="muted">Minimum withdrawal ₹1,000</div></div><div class="panel"><div class="muted">Withdraw to UPI</div><input id="upi" placeholder="yourname@upi"><button id="withdraw">Request withdrawal</button></div><button id="logout" style="background:#39344f">Sign out</button><div id="status" class="muted"></div></section>
<script src="popup.js"></script></body></html>
